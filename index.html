<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0c14">
<title>TESHTAB — Private Messenger</title>
<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070911;
  --bg2:#0b0e18;
  --surface:rgba(255,255,255,0.045);
  --surface-solid:#11141f;
  --border:rgba(255,255,255,0.09);
  --border-soft:rgba(255,255,255,0.06);
  --text:#eef1f7;
  --text-dim:#8891a3;
  --text-faint:#5b6478;
  --accent1:#7c5cff;
  --accent2:#22d3ee;
  --accent-grad:linear-gradient(135deg,var(--accent1),var(--accent2));
  --danger:#ef4a63;
  --danger-grad:linear-gradient(135deg,#ef4a63,#ff7a7a);
  --success:#2ee6a6;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:12px;
  --shadow-lg:0 20px 60px -20px rgba(0,0,0,.7);
  --shadow-glow:0 0 0 1px rgba(124,92,255,.25), 0 10px 40px -10px rgba(124,92,255,.35);
}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
  position:relative;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;-webkit-appearance:none;appearance:none}
input{outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:10px}
::selection{background:rgba(124,92,255,.35)}

/* ============================================================
   ANIMATED BACKGROUND
   ============================================================ */
.bg-orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;will-change:transform}
.orb-1{width:340px;height:340px;background:#5b3bff;top:-90px;left:-80px;animation:floatA 16s ease-in-out infinite}
.orb-2{width:300px;height:300px;background:#0fd3d3;bottom:-100px;right:-60px;animation:floatB 19s ease-in-out infinite}
.orb-3{width:220px;height:220px;background:#c23bff;top:45%;left:60%;animation:floatC 14s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,50px)}}
@keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-40px)}}
@keyframes floatC{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,30px) scale(1.15)}}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:38px 38px;mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 75%)}

/* ============================================================
   SHARED / UTILITY
   ============================================================ */
.screen{display:none;min-height:100vh;min-height:100dvh;position:relative;z-index:1}
.screen.active{display:flex;animation:screenIn .45s cubic-bezier(.22,.9,.32,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.glass{
  background:var(--surface);
  border:1px solid var(--border);
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:14px 18px;border-radius:var(--radius-sm);
  font-weight:600;font-size:14.5px;letter-spacing:.3px;
  position:relative;overflow:hidden;
  transition:transform .18s ease, box-shadow .25s ease, filter .2s ease;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent-grad);color:#0b0715;box-shadow:0 10px 30px -10px rgba(124,92,255,.55)}
.btn-primary:hover{filter:brightness(1.08);box-shadow:0 14px 36px -8px rgba(124,92,255,.7)}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.09)}
.btn-danger{background:rgba(239,74,99,.12);border:1px solid rgba(239,74,99,.4);color:#ff9fae}
.btn-danger:hover{background:rgba(239,74,99,.2)}
.btn-icon{width:auto;padding:10px;border-radius:12px}
.btn-sm{width:auto;padding:10px 16px;font-size:13px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rippleFx .55s ease-out forwards;pointer-events:none}
@keyframes rippleFx{to{transform:scale(2.6);opacity:0}}

.field{position:relative;margin-bottom:14px}
.field svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-faint);transition:color .2s}
.field input{
  width:100%;padding:14px 14px 14px 44px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.035);border:1px solid var(--border);color:var(--text);
  transition:border-color .2s, background .2s, box-shadow .2s;
}
.field input::placeholder{color:var(--text-faint)}
.field input:focus{border-color:var(--accent1);background:rgba(255,255,255,.05);box-shadow:0 0 0 4px rgba(124,92,255,.14)}
.field input:focus + svg,.field:focus-within svg{color:var(--accent2)}

.msg-banner{
  min-height:0;overflow:hidden;font-size:13px;text-align:center;color:#ff9fae;
  max-height:0;opacity:0;transition:max-height .3s ease, opacity .25s ease, margin .3s ease;
}
.msg-banner:not(:empty){max-height:60px;opacity:1;margin:2px 0 14px}
.msg-banner.shake{animation:shakeFx .42s ease}
@keyframes shakeFx{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}

/* ============================================================
   STARTUP SCREEN
   ============================================================ */
#startup-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s ease, visibility .5s}
#startup-screen.fade-out{opacity:0;visibility:hidden;pointer-events:none}
.startup-box{text-align:center}
.loader-ring{position:relative;width:86px;height:86px;margin:0 auto 26px}
.loader-ring .dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent-grad);top:50%;left:50%;
  animation:orbit 1.4s linear infinite;box-shadow:0 0 12px rgba(124,92,255,.8)}
.loader-ring .dot:nth-child(2){animation-delay:-.35s;opacity:.75;background:var(--accent2)}
.loader-ring .dot:nth-child(3){animation-delay:-.7s;opacity:.5}
.loader-ring .dot:nth-child(4){animation-delay:-1.05s;opacity:.3}
.loader-ring .core{position:absolute;inset:26px;border-radius:50%;background:var(--surface-solid);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
@keyframes orbit{from{transform:rotate(0) translateX(38px) rotate(0)}to{transform:rotate(360deg) translateX(38px) rotate(-360deg)}}
.startup-title{font-size:30px;font-weight:800;letter-spacing:9px;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.startup-status{margin-top:14px;color:var(--text-dim);font-size:12.5px;letter-spacing:1px;text-transform:uppercase;animation:pulseText 1.6s ease-in-out infinite}
@keyframes pulseText{0%,100%{opacity:.55}50%{opacity:1}}

/* ============================================================
   NETWORK BADGE (global, floating)
   ============================================================ */
#net-badge{
  position:fixed;top:14px;right:14px;z-index:500;display:flex;align-items:center;gap:7px;
  padding:7px 12px 7px 9px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.3px;
  color:var(--text-dim);opacity:0;transform:translateY(-8px);transition:all .35s ease;
}
#net-badge.show{opacity:1;transform:translateY(0)}
#net-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--text-faint);flex:none}
#net-badge.online .dot{background:var(--success);box-shadow:0 0 0 0 rgba(46,230,166,.6);animation:dotPulse 1.8s infinite}
#net-badge.offline .dot{background:var(--danger)}
#net-badge.busy .dot{background:#f5a623}
@keyframes dotPulse{0%{box-shadow:0 0 0 0 rgba(46,230,166,.55)}70%{box-shadow:0 0 0 8px rgba(46,230,166,0)}100%{box-shadow:0 0 0 0 rgba(46,230,166,0)}}

/* ============================================================
   TOASTS
   ============================================================ */
#toast-stack{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;width:min(92vw,360px);pointer-events:none}
.toast{
  pointer-events:auto;padding:12px 14px;border-radius:14px;font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:10px;color:var(--text);
  background:var(--surface-solid);border:1px solid var(--border);box-shadow:var(--shadow-lg);
  animation:toastIn .35s cubic-bezier(.22,.9,.32,1);
}
.toast.leaving{animation:toastOut .3s ease forwards}
.toast .tdot{width:8px;height:8px;border-radius:50%;flex:none}
.toast.error .tdot{background:var(--danger);box-shadow:0 0 10px rgba(239,74,99,.8)}
.toast.success .tdot{background:var(--success);box-shadow:0 0 10px rgba(46,230,166,.8)}
.toast.info .tdot{background:var(--accent2);box-shadow:0 0 10px rgba(34,211,238,.8)}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px) scale(.96)}}

/* ============================================================
   AUTH SCREEN
   ============================================================ */
#auth-screen{align-items:center;justify-content:center;padding:22px}
.auth-box{width:min(400px,100%);padding:34px 28px;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);animation:popIn .5s cubic-bezier(.22,.9,.32,1)}
@keyframes popIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.brand-mark{width:56px;height:56px;border-radius:16px;margin:0 auto 18px;background:var(--accent-grad);
  display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px -10px rgba(124,92,255,.6)}
.brand-mark svg{width:28px;height:28px;color:#0b0715}
.logo{font-size:26px;font-weight:800;letter-spacing:6px;text-align:center}
.subtitle{color:var(--text-dim);font-size:12px;letter-spacing:2px;text-align:center;margin-bottom:28px;text-transform:uppercase}

/* ============================================================
   HOME SCREEN
   ============================================================ */
#home-screen{padding:22px;align-items:flex-start;justify-content:center}
.home-box{width:min(640px,100%);margin:auto 0;padding:6px 0}
.home-header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:26px}
.home-user{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{
  width:44px;height:44px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;color:#0b0715;background:var(--accent-grad);
  box-shadow:0 8px 20px -8px rgba(124,92,255,.6);
}
.home-user-text{min-width:0}
.home-title{font-size:19px;font-weight:800;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-sub{font-size:11.5px;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase}

.room-actions{display:grid;gap:16px}
.action-card{
  border-radius:var(--radius-md);padding:22px;position:relative;overflow:hidden;
  animation:cardIn .5s cubic-bezier(.22,.9,.32,1) both;
}
.action-card:nth-child(1){animation-delay:.05s}
.action-card:nth-child(2){animation-delay:.15s}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.action-card::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle at 30% 0%,rgba(124,92,255,.18),transparent 60%)}
.action-card:hover::before{opacity:1}
.action-row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.action-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.action-icon svg{width:20px;height:20px}
.action-icon.create{background:rgba(124,92,255,.15);color:#a996ff}
.action-icon.join{background:rgba(34,211,238,.15);color:#7be3f5}
.action-title{font-size:15.5px;font-weight:700}
.action-desc{font-size:12px;color:var(--text-dim);margin-top:2px}
.room-input{display:flex;gap:10px}
.room-input input{letter-spacing:4px;text-align:center;font-weight:700}

/* ============================================================
   CHAT SCREEN
   ============================================================ */
#chat-screen{flex-direction:column}
.chat-header{
  min-height:66px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));gap:10px;
}
.chat-id{display:flex;align-items:center;gap:12px;min-width:0}
.chat-avatar{
  width:42px;height:42px;border-radius:12px;flex:none;position:relative;
  display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1c2030,#12141f);
  border:1px solid var(--border);
}
.chat-avatar svg{width:19px;height:19px;color:var(--accent2)}
.status-dot{position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--text-faint);
  border:2px solid var(--bg2);transition:background .3s}
.status-dot.online{background:var(--success);box-shadow:0 0 0 0 rgba(46,230,166,.6);animation:dotPulse 1.8s infinite}
.status-dot.offline{background:var(--danger)}
.status-dot.busy{background:#f5a623}
.chat-id-text{min-width:0}
.room-line{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-line span{color:var(--accent2);letter-spacing:1px}
.room-info{font-size:11px;color:var(--text-dim);letter-spacing:.4px;text-transform:uppercase}
.chat-actions{display:flex;gap:6px;flex:none}

#messages{
  flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth;
  background:radial-gradient(circle at 50% 0%,rgba(124,92,255,.05),transparent 55%);
}
.empty-chat{margin:auto;text-align:center;color:var(--text-faint);font-size:13px;padding:40px 20px}
.empty-chat svg{width:34px;height:34px;margin-bottom:10px;opacity:.5}

.msg-row{display:flex;gap:9px;margin:7px 0;max-width:82%;animation:msgIn .32s cubic-bezier(.22,.9,.32,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.msg-row.mine{margin-left:auto;flex-direction:row-reverse}
.msg-avatar{width:28px;height:28px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;background:linear-gradient(135deg,#2a2f45,#181b28);color:var(--text-dim);margin-top:auto}
.msg-col{min-width:0;display:flex;flex-direction:column}
.msg-row.mine .msg-col{align-items:flex-end}
.msg-sender{font-size:10.5px;color:var(--text-faint);margin-bottom:3px;padding:0 3px;letter-spacing:.3px}
.msg-row.mine .msg-sender{display:none}
.msg-body{
  padding:10px 13px;border-radius:16px 16px 16px 4px;word-break:break-word;font-size:14px;line-height:1.42;
  background:var(--surface);border:1px solid var(--border-soft);
}
.msg-row.mine .msg-body{background:var(--accent-grad);color:#0b0715;border:none;border-radius:16px 16px 4px 16px;font-weight:500}
.msg-time{font-size:9.5px;color:var(--text-faint);margin-top:3px;padding:0 3px}

.chat-input{display:flex;gap:10px;padding:12px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border-soft)}
.chat-input .field{flex:1;margin:0}
.chat-input input{border-radius:999px;padding:13px 18px}
.send-btn{
  width:48px;height:48px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--accent-grad);box-shadow:0 8px 24px -8px rgba(124,92,255,.7);transition:transform .18s ease, filter .2s;
}
.send-btn:active{transform:scale(.9)}
.send-btn svg{width:19px;height:19px;color:#0b0715;margin-left:1px}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:640px){
  .auth-box{padding:26px 20px}
  .action-card{padding:18px}
  #net-badge{top:auto;bottom:14px;right:14px}
}
@media(min-width:641px) and (max-width:1024px){
  .home-box{max-width:560px}
}
@media(min-width:1025px){
  .auth-box{width:420px}
  .home-box{max-width:680px}
  #messages{padding:26px 40px}
  .chat-input{padding:16px 40px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>

<div id="net-badge"><span class="dot"></span><span id="net-badge-text">Connecting</span></div>
<div id="toast-stack"></div>

<!-- STARTUP -->
<div id="startup-screen">
  <div class="startup-box">
    <div class="loader-ring">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="core">T</div>
    </div>
    <div class="startup-title">TESHTAB</div>
    <div class="startup-status" id="startup-status">Connecting...</div>
  </div>
</div>

<!-- AUTH -->
<div id="auth-screen" class="screen">
  <div class="auth-box glass">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
    </div>
    <div class="logo">TESHTAB</div>
    <div class="subtitle">Private Messenger</div>

    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <input id="username" placeholder="Username" autocomplete="username">
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    </div>

    <button class="btn btn-primary" onclick="login()">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path></svg>
      LOGIN
    </button>
    <div id="auth-message" class="msg-banner"></div>
  </div>
</div>

<!-- HOME -->
<div id="home-screen" class="screen">
  <div class="home-box">
    <div class="home-header">
      <div class="home-user">
        <div class="avatar" id="home-avatar">?</div>
        <div class="home-user-text">
          <div class="home-title" id="home-welcome">TESHTAB</div>
          <div class="home-sub">Online</div>
        </div>
      </div>
      <button class="btn btn-danger btn-sm" onclick="logout()">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
        LOGOUT
      </button>
    </div>

    <div id="home-message" class="msg-banner"></div>

    <div class="room-actions">
      <div class="action-card glass">
        <div class="action-row">
          <div class="action-icon create">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
          </div>
          <div>
            <div class="action-title">Create a Room</div>
            <div class="action-desc">Start a fresh private space and share the code</div>
          </div>
        </div>
        <button class="btn btn-primary" onclick="createRoom()">CREATE ROOM</button>
      </div>

      <div class="action-card glass">
        <div class="action-row">
          <div class="action-icon join">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 21 10a2.83 2.83 0 0 0-4-4L6.5 16.5V20h3.5Z"></path><path d="m15 5 4 4"></path></svg>
          </div>
          <div>
            <div class="action-title">Join a Room</div>
            <div class="action-desc">Enter the 6-digit code you received</div>
          </div>
        </div>
        <div class="room-input">
          <input id="room-id" class="field-plain" maxlength="6" inputmode="numeric" placeholder="000000">
          <button class="btn btn-ghost btn-sm" onclick="joinRoom()">JOIN</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- CHAT -->
<div id="chat-screen" class="screen">
  <div class="chat-header">
    <div class="chat-id">
      <div class="chat-avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-4-1L3 20l1-5.5a8.38 8.38 0 0 1-1-4A8.5 8.5 0 0 1 12.5 2a8.38 8.38 0 0 1 8.5 8.5Z"></path></svg>
        <span class="status-dot" id="status-dot"></span>
      </div>
      <div class="chat-id-text">
        <div class="room-line">ROOM <span id="room-display"></span></div>
        <div class="room-info" id="connection-status">CONNECTED</div>
      </div>
    </div>
    <div class="chat-actions">
      <button class="btn btn-ghost btn-icon" onclick="copyRoomId()" title="Copy room ID">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      </button>
      <button class="btn btn-ghost btn-icon" onclick="toggleFullscreen()" title="Fullscreen">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
      </button>
      <button class="btn btn-danger btn-icon" onclick="exitRoom()" title="Exit room">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
      </button>
    </div>
  </div>

  <div id="messages"></div>

  <div class="chat-input">
    <div class="field" style="margin:0">
      <input id="message-input" placeholder="Type a message..." autocomplete="off" style="padding-left:18px">
    </div>
    <button class="send-btn" onclick="sendMessage()" title="Send">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5v-17l19 8.5-19 8.5Zm2-2.6L17.2 12 5 6.1v4.2l8 1.7-8 1.7v4.2Z"></path></svg>
    </button>
  </div>
</div>

<script>
/* ============================================================
   ORIGINAL STATE — unchanged
   ============================================================ */
let ws=null;
let currentUser=null;
let currentRoom=null;
let sessionToken=null;

/* ============================================================
   ORIGINAL CORE FUNCTIONS — logic preserved exactly,
   only additive UI/animation hooks inserted where noted
   ============================================================ */

function showScreen(id){
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function showMessage(id,text){
  const el=document.getElementById(id);
  el.textContent=text||"";
  // additive: shake + toast feedback, does not alter original behavior
  if(text){
    el.classList.remove("shake");
    void el.offsetWidth;
    el.classList.add("shake");
    showToast(text,"error");
  }
}

function hideStartupScreen(){
  const el=document.getElementById("startup-screen");
  el.classList.add("fade-out"); // additive: smooth fade instead of instant hide
  setTimeout(function(){ el.style.display="none"; },500);
}

function getWebSocketUrl(){
  if(location.hostname==="localhost"||location.hostname==="127.0.0.1"){
    return "ws://"+location.hostname+":8000";
  }
  return "wss://chat-app-fnl0.onrender.com";
}

function connect(){
  try{
    ws=new WebSocket(getWebSocketUrl());

    ws.onopen=function(){
      hideStartupScreen();
      document.getElementById("connection-status").textContent="CONNECTED";
      setNetBadge("online","Connected");      // additive
      setStatusDot("online");                 // additive
      const token=localStorage.getItem("void_session_token");
      if(token){
        sessionToken=token;
        ws.send(JSON.stringify({
          type:"RESTORE_SESSION",
          session_token:token
        }));
      }else{
        showScreen("auth-screen");
      }
    };

    ws.onmessage=function(event){
      let data;
      try{data=JSON.parse(event.data)}catch(e){return}
      handleServerMessage(data);
    };

    ws.onerror=function(){
      hideStartupScreen();
      document.getElementById("connection-status").textContent="CONNECTION ERROR";
      setNetBadge("offline","Connection error"); // additive
      setStatusDot("offline");                   // additive
      showScreen("auth-screen");
    };

    ws.onclose=function(){
      document.getElementById("connection-status").textContent="DISCONNECTED";
      setNetBadge("offline","Disconnected");     // additive
      setStatusDot("offline");                   // additive
    };
  }catch(e){
    hideStartupScreen();
    showScreen("auth-screen");
  }
}

function handleServerMessage(data){
  switch(data.type){
    case "LOGIN_RES":
      handleLoginResponse(data);
      break;

    case "SESSION_RESTORED":
      handleSessionRestore(data);
      break;

    case "ROOM_CREATED":
      currentRoom=data.room_id;
      document.getElementById("room-display").textContent=currentRoom;
      showScreen("chat-screen");
      clearChat();
      showToast("Room "+currentRoom+" created","success"); // additive
      break;

    case "JOIN_SUCCESS":
      currentRoom=data.room_id;
      document.getElementById("room-display").textContent=currentRoom;
      showScreen("chat-screen");
      clearChat();

      if(data.history){
        data.history.forEach(function(item){
          appendMessage(item[0],item[1]);
        });
      }
      showToast("Joined room "+currentRoom,"success"); // additive
      break;

    case "ROOM_FULL":
      showMessage("home-message","ROOM FULL");
      break;

    case "ROOM_NOT_FOUND":
      showMessage("home-message","ROOM NOT FOUND");
      break;

    case "NEW_MSG":
      appendMessage(data.sender,data.message);
      break;

    case "MESSAGE_FAILED":
      showMessage("home-message","MESSAGE FAILED");
      break;

    case "ROOM_EXITED":
      currentRoom=null;
      showScreen("home-screen");
      showToast("You left the room","info"); // additive
      break;

    case "NOT_IN_ROOM":
      showMessage("home-message","NOT IN ROOM");
      break;

    case "LOGOUT_SUCCESS":
      localStorage.removeItem("void_session_token");
      sessionToken=null;
      currentUser=null;
      currentRoom=null;
      showScreen("auth-screen");
      break;

    case "AUTH_REQUIRED":
      showScreen("auth-screen");
      showToast("Please login again","info"); // additive
      break;
  }
}

function login(){
  const user=document.getElementById("username").value.trim();
  const pwd=document.getElementById("password").value;

  if(!user||!pwd){
    showMessage("auth-message","Username and password required.");
    return;
  }

  if(!ws||ws.readyState!==WebSocket.OPEN){
    showMessage("auth-message","Server not connected.");
    return;
  }

  clearMessage("auth-message");

  ws.send(JSON.stringify({
    type:"LOGIN",
    username:user,
    password:pwd
  }));
}

function handleLoginResponse(data){
  if(data.status==="SUCCESS"){
    currentUser=data.user;
    sessionToken=data.session_token;

    localStorage.setItem(
      "void_session_token",
      sessionToken
    );

    showMessage("auth-message","");
    updateIdentityUI();  // additive: fills avatar/welcome text
    showScreen("home-screen");
  }else{
    showMessage("auth-message","Invalid username or password.");
  }
}

function handleSessionRestore(data){
  if(data.status!=="SUCCESS"){
    localStorage.removeItem("void_session_token");
    sessionToken=null;
    showScreen("auth-screen");
    return;
  }

  currentUser=data.user;
  currentRoom=data.room_id||null;
  updateIdentityUI(); // additive

  if(currentRoom){
    document.getElementById("room-display").textContent=currentRoom;
    clearChat();

    if(data.history){
      data.history.forEach(function(item){
        appendMessage(item[0],item[1]);
      });
    }

    showScreen("chat-screen");
  }else{
    showScreen("home-screen");
  }
}

function createRoom(){
  if(!ws||ws.readyState!==WebSocket.OPEN){
    showMessage("home-message","Server not connected.");
    return;
  }

  clearMessage("home-message");

  ws.send(JSON.stringify({
    type:"CREATE_ROOM"
  }));
}

function joinRoom(){
  const room=document.getElementById("room-id").value.trim();

  if(!/^[0-9]{6}$/.test(room)){
    showMessage("home-message","Room ID must be exactly 6 digits.");
    return;
  }

  if(!ws||ws.readyState!==WebSocket.OPEN){
    showMessage("home-message","Server not connected.");
    return;
  }

  clearMessage("home-message");

  ws.send(JSON.stringify({
    type:"JOIN_ROOM",
    room_id:room
  }));
}

function sendMessage(){
  const input=document.getElementById("message-input");
  const msg=input.value.trim();

  if(!msg)return;

  if(!ws||ws.readyState!==WebSocket.OPEN){
    showMessage("home-message","Server not connected.");
    return;
  }

  if(!currentRoom)return;

  ws.send(JSON.stringify({
    type:"SEND_MSG",
    message:msg
  }));

  input.value="";
  input.focus();
}

function clearChat(){
  document.getElementById("messages").innerHTML="";
  refreshEmptyState(); // additive
}

function appendMessage(sender,message){
  const container=document.getElementById("messages");

  const mine = sender===currentUser;

  const row=document.createElement("div");
  row.className="msg-row"+(mine?" mine":"");

  const avatar=document.createElement("div");
  avatar.className="msg-avatar";
  avatar.textContent=(sender||"?").trim().charAt(0).toUpperCase();

  const col=document.createElement("div");
  col.className="msg-col";

  const senderEl=document.createElement("div");
  senderEl.className="msg-sender";
  senderEl.textContent=sender;

  const bodyEl=document.createElement("div");
  bodyEl.className="msg-body";
  bodyEl.textContent=message;

  const timeEl=document.createElement("div");
  timeEl.className="msg-time";
  timeEl.textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});

  col.appendChild(senderEl);
  col.appendChild(bodyEl);
  col.appendChild(timeEl);

  row.appendChild(avatar);
  row.appendChild(col);
  container.appendChild(row);

  container.scrollTop=container.scrollHeight;
  refreshEmptyState(); // additive
}

function exitRoom(){
  if(!ws||ws.readyState!==WebSocket.OPEN){
    showMessage("home-message","Server not connected.");
    return;
  }

  ws.send(JSON.stringify({
    type:"EXIT_ROOM"
  }));
}

function logout(){
  if(!ws||ws.readyState!==WebSocket.OPEN){
    localStorage.removeItem("void_session_token");
    sessionToken=null;
    currentUser=null;
    currentRoom=null;
    showScreen("auth-screen");
    return;
  }

  ws.send(JSON.stringify({
    type:"LOGOUT"
  }));
}

function copyRoomId(){
  if(!currentRoom)return;

  if(navigator.clipboard){
    navigator.clipboard.writeText(currentRoom)
    .then(function(){
      document.getElementById("connection-status").textContent="ROOM ID COPIED";
      showToast("Room ID copied","success"); // additive
      setTimeout(function(){
        document.getElementById("connection-status").textContent="CONNECTED";
      },1500);
    })
    .catch(function(){
      document.getElementById("connection-status").textContent="COPY FAILED";
      showToast("Copy failed","error"); // additive
    });
  }
}

document.getElementById("message-input").addEventListener("keydown",function(event){
  if(event.key==="Enter"){
    event.preventDefault();
    sendMessage();
  }
});

document.getElementById("room-id").addEventListener("input",function(){
  this.value=this.value.replace(/\D/g,"").slice(0,6);
});

document.getElementById("password").addEventListener("keydown",function(event){
  if(event.key==="Enter"){
    event.preventDefault();
    login();
  }
});

window.addEventListener("load",function(){
  connect();
});

function clearMessage(id){
  document.getElementById(id).textContent="";
}

function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(function(){
      document.getElementById("connection-status").textContent="FULLSCREEN BLOCKED";
      showToast("Fullscreen blocked by browser","info"); // additive
    });
  }else{
    document.exitFullscreen();
  }
}

/* ============================================================
   ADDITIVE UI ENHANCEMENTS
   (toasts, badges, ripple, avatars — no protocol/logic changes)
   ============================================================ */

function showToast(text,type){
  if(!text)return;
  const stack=document.getElementById("toast-stack");
  const t=document.createElement("div");
  t.className="toast "+(type||"info");
  const dot=document.createElement("span");
  dot.className="tdot";
  const label=document.createElement("span");
  label.textContent=text;
  t.appendChild(dot);
  t.appendChild(label);
  stack.appendChild(t);

  setTimeout(function(){
    t.classList.add("leaving");
    setTimeout(function(){ t.remove(); },280);
  },3000);
}

function setNetBadge(state,text){
  const badge=document.getElementById("net-badge");
  const label=document.getElementById("net-badge-text");
  badge.classList.remove("online","offline","busy");
  badge.classList.add(state);
  badge.classList.add("show");
  label.textContent=text;
}

function setStatusDot(state){
  const dot=document.getElementById("status-dot");
  if(!dot)return;
  dot.classList.remove("online","offline","busy");
  dot.classList.add(state);
}

function getInitial(name){
  return (name||"?").trim().charAt(0).toUpperCase();
}

function updateIdentityUI(){
  if(!currentUser)return;
  const av=document.getElementById("home-avatar");
  const welcome=document.getElementById("home-welcome");
  if(av)av.textContent=getInitial(currentUser);
  if(welcome)welcome.textContent="Hi, "+currentUser;
}

// Ripple feedback on all .btn elements
document.addEventListener("click",function(e){
  const btn=e.target.closest(".btn");
  if(!btn)return;
  const rect=btn.getBoundingClientRect();
  const circle=document.createElement("span");
  const size=Math.max(rect.width,rect.height);
  circle.className="ripple";
  circle.style.width=circle.style.height=size+"px";
  circle.style.left=(e.clientX-rect.left-size/2)+"px";
  circle.style.top=(e.clientY-rect.top-size/2)+"px";
  btn.style.position=btn.style.position||"relative";
  btn.appendChild(circle);
  setTimeout(function(){ circle.remove(); },600);
});

// Empty-state placeholder in chat when a room has no messages yet
function refreshEmptyState(){
  const container=document.getElementById("messages");
  if(!container)return;
  let ph=document.getElementById("empty-chat-ph");
  if(container.children.length===0){
    ph=document.createElement("div");
    ph.id="empty-chat-ph";
    ph.className="empty-chat";
    ph.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-4-1L3 20l1-5.5a8.38 8.38 0 0 1-1-4A8.5 8.5 0 0 1 12.5 2a8.38 8.38 0 0 1 8.5 8.5Z"></path></svg><div>No messages yet. Say hello 👋</div>';
    container.appendChild(ph);
  }else if(ph && container.children.length>1){
    ph.remove();
  }
}
</script>
</body>
</html>
