name: Build TeshTab APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files + Capacitor config
        run: node scripts/prepare.js

      - name: Add Android platform
        run: npx cap add android

      - name: Icon (only if app/assets/icon.png exists)
        run: |
          if [ -f assets/icon.png ]; then
            npm install --no-save @capacitor/assets
            npx capacitor-assets generate --android
          else
            echo "No assets/icon.png - using default icon"
          fi

      - name: Use the fixed signing key (so updates install over old versions)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Set version from run number
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TeshTab.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeshTab-apk
          path: app/TeshTab.apk

      - name: Publish as GitHub Release (easy download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TeshTab build ${{ github.run_number }}
          files: app/TeshTab.apk
